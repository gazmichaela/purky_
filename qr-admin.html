<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Admin - Vánoční QR Quest</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<style>
body{font-family:Arial;text-align:center;background:#f0f0f0;padding:30px;}
input,textarea,select{padding:8px;margin:5px;width:80%;border-radius:6px;border:1px solid #333;}
button{padding:10px 20px;margin:10px;border-radius:8px;background:#003366;color:#FFD700;border:none;cursor:pointer;}
button:hover{background:#001f4d;}
#qrcodeContainer{margin-top:20px;display:inline-block;padding:20px;background:#fff0f0;border-radius:20px;}
#placesList{margin-top:20px;text-align:left;display:inline-block;background:#fff;padding:10px;border-radius:10px;max-height:300px;overflow-y:auto;}
</style>
</head>
<body>
<h1>Admin - Vánoční QR Quest</h1>

<p>Název místa:</p>
<input id="placeName" placeholder="např. vchod, šatna, chemie"><br>
<button onclick="generateQRCode()">Vygenerovat QR kód</button>

<div id="qrcodeContainer"></div>

<h3>Seznam míst:</h3>
<div id="placesList"></div>

<script>
let places=[];
let currentQRCodeURL="";

function generateQRCode(){
  const place=document.getElementById('placeName').value.trim();
  if(!place){ alert('Vyplň název místa'); return; }
  if(places.includes(place)){ alert('Místo už existuje'); return; }

  places.push(place);

  const container=document.getElementById('qrcodeContainer');
  container.innerHTML='';
  const canvas=document.createElement('canvas');
  container.appendChild(canvas);

  QRCode.toCanvas(canvas, JSON.stringify({place}), {width:250}, function(err){
    if(err){ console.error(err); return; }
    currentQRCodeURL=canvas.toDataURL("image/png");
  });

  updatePlacesList();
}

function updatePlacesList(){
  const list=document.getElementById('placesList');
  list.innerHTML='';
  places.forEach((p,i)=>{
    const div=document.createElement('div');
    div.innerText=`${i+1}. ${p}`;
    list.appendChild(div);
  });
}
</script>
</body>
</html>
